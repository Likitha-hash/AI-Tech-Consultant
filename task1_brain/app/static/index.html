<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knowledge Brain</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#1a1a1a;background:#fafafa}
h1{font-size:20px} .tabs button{padding:8px 14px;border:1px solid #ccc;background:#fff;cursor:pointer;border-radius:6px 6px 0 0}
.tabs button.on{background:#1a1a1a;color:#fff} .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
textarea,input{width:100%;box-sizing:border-box;padding:8px;font:inherit;border:1px solid #bbb;border-radius:6px}
button.go{padding:8px 16px;background:#2f6fed;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:6px}
.src a{display:block;font-size:14px} .warn{background:#fff4e5;border-color:#f0b35a} small{color:#666}
</style></head><body>
<h1>Knowledge Brain <small id="stat"></small></h1>
<div class="tabs"><button id="t1" class="on" onclick="tab(1)">Ask</button><button id="t2" onclick="tab(2)">Expert queue <span id="n"></span></button></div>
<div id="p1"><div class="card"><input id="q" placeholder="Ask anything about the product..." onkeydown="if(event.key==='Enter')ask()">
<button class="go" onclick="ask()">Ask</button></div><div id="out"></div></div>
<div id="p2" hidden><div id="tasks"></div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tab(n){$('p1').hidden=n!=1;$('p2').hidden=n!=2;$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':'';if(n==2)load()}
async function ask(){const q=$('q').value.trim();if(!q)return;$('out').innerHTML='<div class="card">Thinking...</div>';
 try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
 if(!r.ok)throw new Error(await r.text());const d=await r.json();
 $('out').innerHTML=`<div class="card ${d.confident?'':'warn'}"><div>${esc(d.answer).replace(/\n/g,'<br>')}</div>
 <div class="src">${d.sources.map(s=>`<a href="${esc(s.url)}" target="_blank">[${s.n}] ${esc(s.title)} (${s.kind})</a>`).join('')}</div>
 <small>cost $${d.cost.usd} - ${d.cost.ms} ms${d.task_id?` - expert task #${d.task_id} created`:''}</small></div>`;refresh()}
 catch(e){$('out').innerHTML=`<div class="card warn">Something went wrong: ${esc(e.message)}</div>`}}
async function load(){const t=await (await fetch('/tasks')).json();$('tasks').innerHTML=t.length?t.map(x=>`<div class="card"><b>${esc(x.question)}</b>
 <textarea id="a${x.id}" rows="3" placeholder="Expert answer..."></textarea><button class="go" onclick="send(${x.id})">Save answer</button></div>`).join(''):'<div class="card">No open questions.</div>'}
async function send(id){const a=$('a'+id).value.trim();if(a.length<3)return;await fetch(`/tasks/${id}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answer:a})});load();refresh()}
async function refresh(){const h=await (await fetch('/health')).json();$('stat').textContent=`${h.pages.active||0} articles, ${h.images} images`;$('n').textContent=h.open_tasks?`(${h.open_tasks})`:''}
refresh();
</script></body></html>
