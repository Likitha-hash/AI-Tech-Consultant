<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting to Scope of Work</title><style>
body{font:16px/1.5 system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;background:#fafafa;color:#1a1a1a}
textarea,input{width:100%;box-sizing:border-box;padding:8px;font:inherit;border:1px solid #bbb;border-radius:6px}
button{padding:8px 16px;background:#2f6fed;color:#fff;border:0;border-radius:6px;cursor:pointer;margin:6px 6px 6px 0}
button.ok{background:#1f8a4c}.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px;margin:10px 0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:13px;background:#eee}.new{background:#d8f5e3}.changed{background:#fff0c2}.removed{background:#fbd5d5}
pre{white-space:pre-wrap}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #eee;padding:4px;text-align:left;font-size:14px}</style></head><body>
<h1>Meeting to Scope of Work</h1>
<div class="card"><label>Project name <input id="pid" value="demo-client"></label>
<label>Paste meeting transcript <textarea id="tx" rows="8" placeholder="Client: We need..."></textarea></label>
<label><input type="checkbox" id="fu" style="width:auto"> This is a follow-up meeting (compare with the last approved version)</label><br>
<button onclick="run()">Create scope, estimate and proposal</button> <span id="st"></span></div><div id="out"></div>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function run(){$('st').textContent='Working... (1-3 minutes for long transcripts)';
 const r=await fetch('/projects/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({project_id:$('pid').value,transcripts:[$('tx').value],follow_up:$('fu').checked})});
 const d=await r.json();$('st').textContent='';if(!r.ok){$('out').innerHTML='<div class="card">'+esc(d.detail)+'</div>';return}show(d)}
function show(v){const p=v.price;$('out').innerHTML=`<div class="card"><b>Version ${v.n}</b> - <span class="tag">${v.status}</span>
 <button class="ok" onclick="appr(${v.n})">Approve (a human has checked this)</button>
 <p>Price: <b>${p.currency} ${p.price_low} - ${p.price_high}</b> (${p.hours_low}-${p.hours_high} h, incl. ${p.contingency*100}% buffer) - AI cost $${v.cost.usd}</p>
 ${v.review.ok?'':'<p style="color:#b00">Reviewer still has concerns: '+esc(v.review.issues.join('; '))+'</p>'}</div>
 <div class="card"><h3>Scope</h3><table>${v.scope.items.map(i=>`<tr><td><span class="tag ${i.status}">${i.status}</span></td><td><b>${esc(i.id)} ${esc(i.title)}</b><br>${esc(i.change_summary||i.description)}</td></tr>`).join('')}</table>
 <h4>Questions to ask the client</h4><ul>${v.scope.questions_for_client.map(q=>'<li>'+esc(q)+'</li>').join('')}</ul></div>
 ${v.quote_extra.length?'<div class="card"><h3>Outside the agreed scope - quote extra</h3>'+v.quote_extra.map(i=>'<p>'+esc(i.id+' '+i.title)+'</p>').join('')+'</div>':''}
 <div class="card"><h3>Proposal draft</h3><pre>${esc(v.proposal_markdown)}</pre></div>`}
async function appr(n){const r=await fetch(`/projects/${$('pid').value}/versions/${n}/approve?who=reviewer`,{method:'POST'});if(r.ok)alert('Approved. It can now be sent to the client.')}
</script></body></html>
